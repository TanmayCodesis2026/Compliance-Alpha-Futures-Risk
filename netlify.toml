[build]
  # This file sits at the git repo root, so no base directory is needed.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires ^20.19.0 || >=22.12.0 — Netlify's older default (18) fails the build.
  NODE_VERSION = "22"

# SPA fallback: the app has no server-side routes, so every path must serve
# index.html and let React render. Without this, a refresh on any URL other
# than "/" returns Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
